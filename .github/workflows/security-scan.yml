name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security scans weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  bandit-scan:
    name: Bandit Security Scan (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Bandit
      run: |
        python -m pip install --upgrade pip
        pip install bandit[toml] bandit-sarif-formatter

    - name: Run Bandit scan
      run: |
        bandit -r backend/app \
          -f json \
          -o bandit-report.json \
          --severity-level medium \
          --confidence-level medium \
          --exclude backend/app/migrations,backend/app/__pycache__
      continue-on-error: true

    - name: Run Bandit scan with SARIF output
      run: |
        bandit -r backend/app \
          -f sarif \
          -o bandit-report.sarif \
          --severity-level medium \
          --confidence-level medium \
          --exclude backend/app/migrations,backend/app/__pycache__
      continue-on-error: true

    - name: Upload Bandit results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: bandit-report.sarif
        category: bandit

    - name: Upload Bandit report artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-security-report
        path: |
          bandit-report.json
          bandit-report.sarif
        retention-days: 30

    - name: Check Bandit results
      run: |
        if [ -f bandit-report.json ]; then
          # Count high severity issues
          high_issues=$(jq '[.results[] | select(.issue_severity == "HIGH")] | length' bandit-report.json)
          echo "High severity issues found: $high_issues"

          if [ "$high_issues" -gt 0 ]; then
            echo "❌ Security issues found! Please review bandit-report.json"
            jq '.results[] | select(.issue_severity == "HIGH")' bandit-report.json
            exit 1
          else
            echo "✅ No high severity security issues found"
          fi
        fi
      continue-on-error: true

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Safety
      run: |
        python -m pip install --upgrade pip
        pip install safety

    - name: Check Python dependencies with Safety
      run: |
        pip install -r requirements.txt
        if [ -f backend/requirements.txt ]; then
          pip install -r backend/requirements.txt
        fi
        safety check --json --output safety-report.json || true
      continue-on-error: true

    - name: Upload Safety report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: safety-dependency-report
        path: safety-report.json
        retention-days: 30

  secrets-scan:
    name: Secrets Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for all branches

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      continue-on-error: true

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [bandit-scan, dependency-scan, secrets-scan, codeql-analysis]
    if: always()

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      continue-on-error: true

    - name: Generate security summary
      run: |
        echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Bandit (Python Security) | ${{ needs.bandit-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Secrets Scan | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| CodeQL Analysis | ${{ needs.codeql-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Review detailed reports in the artifacts section." >> $GITHUB_STEP_SUMMARY

    - name: Check overall status
      run: |
        if [ "${{ needs.bandit-scan.result }}" == "failure" ] || \
           [ "${{ needs.dependency-scan.result }}" == "failure" ] || \
           [ "${{ needs.secrets-scan.result }}" == "failure" ] || \
           [ "${{ needs.codeql-analysis.result }}" == "failure" ]; then
          echo "⚠️ Some security scans failed. Please review the reports."
          exit 0  # Don't fail the build, just warn
        else
          echo "✅ All security scans passed"
        fi
