name: docassist_mobile
description: DocAssist Practice Manager - Premium appointment scheduling for doctors
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.0

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.1.0

  # Network
  dio: ^5.4.0
  retrofit: ^4.0.3
  web_socket_channel: ^2.4.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # Authentication
  jwt_decoder: ^2.0.1

  # Forms & Validation
  reactive_forms: ^16.1.1

  # Date/Time
  intl: ^0.19.0
  table_calendar: ^3.0.9

  # Utilities
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  logger: ^2.0.2+1
  equatable: ^2.0.5
  uuid: ^4.3.1

  # Connectivity
  connectivity_plus: ^5.0.2

  # Permissions
  permission_handler: ^11.2.0

  # Voice (for voice booking)
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.5

  # Notifications
  flutter_local_notifications: ^16.3.0
  firebase_messaging: ^14.7.10
  firebase_core: ^2.24.2

  # URL Launcher
  url_launcher: ^6.2.3

  # Share
  share_plus: ^7.2.1

  # Document Scanner & OCR (Phase 10)
  image_picker: ^1.0.7
  image_cropper: ^5.0.1
  camera: ^0.10.5+9

  # Telemedicine Video Calls (Phase 17)
  flutter_webrtc: ^0.9.47

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  retrofit_generator: ^8.0.6
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1

  # Testing
  mocktail: ^1.0.1

  # Icons Generation
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1976D2"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
