[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docassist-practice-manager"
version = "0.1.0"
description = "Premium appointment scheduling and practice management for Indian doctors"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [
    {name = "DocAssist Team"}
]
keywords = ["healthcare", "practice-management", "appointments", "medical", "EMR"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # UI Framework
    "flet>=0.21.0",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",

    # Vector Database
    "chromadb>=0.4.0",

    # Data Validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # API Layer
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",

    # LLM Integration
    "ollama>=0.1.0",
    "sentence-transformers>=2.2.0",

    # Voice Processing
    "openai-whisper>=20231117",
    "openwakeword>=0.5.0",
    "piper-tts>=1.2.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.0",

    # PDF Generation
    "fpdf2>=2.7.0",
    "qrcode>=7.4.0",
    "pillow>=10.0.0",

    # File System Watching
    "watchdog>=3.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "black>=24.1.0",
    "pre-commit>=3.6.0",
]

sms = [
    # SMS Gateway integrations
    "twilio>=8.0.0",
]

whatsapp = [
    # WhatsApp Business API
    "python-whatsapp-business>=0.4.0",
]

[project.scripts]
practice-manager = "main:main"

[project.urls]
Homepage = "https://github.com/drshailesh88/appointment_system"
Repository = "https://github.com/drshailesh88/appointment_system"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.isort]
known-first-party = ["src"]

[tool.black]
target-version = ["py311"]
line-length = 100
